name: Build-OpenWrt-25-x86-64

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "选择要编译的源码"
        required: true
        default: "immortalwrt/immortalwrt"
        type: string

      repo_branch:
        description: "选择要编译的分支"
        required: true
        default: "v25.12.1"
        type: string

      part_size:
        description: "设置rootfs大小"
        required: false
        default: 1024
        type: number

      ip_address:
        description: "设置默认IP地址"
        required: false
        default: "192.168.10.1"
        type: string

      upload_artifact:
        description: "上传固件到Artifact"
        required: false
        default: true
        type: boolean

      upload_release:
        description: "上传固件到Releases"
        required: false
        default: true
        type: boolean

env:
  OPENWRT_DIR: openwrt
  UPLOAD_DIR: upload
  LOG_DIR: logs
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build_OpenWrt:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      OPENWRT_REPO: ${{ inputs.repo_name || 'immortalwrt/immortalwrt' }}
      OPENWRT_BRANCH: ${{ inputs.repo_branch || 'v25.12.1' }}
      PART_SIZE: ${{ inputs.part_size || 1024 }}
      IP_ADDRESS: ${{ inputs.ip_address || '192.168.10.1' }}
      UPLOAD_ARTIFACT: ${{ inputs.upload_artifact}}
      UPLOAD_RELEASE: ${{ inputs.upload_release }}
      CCACHE_DIR: /home/runner/.ccache
      LOG_REDIRECTION_ENABLE: 1 # 是否开启日志重定向，0 不启用， 1 启用

    strategy:
      fail-fast: false
      matrix:
        config_name:
          # - minimal
          # - standard
          - full

    steps:
      - name: 克隆仓库
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 当前环境信息
        run: |
          chmod +x scripts/check.sh && ./scripts/check.sh

      - name: 清理磁盘空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 清理后硬盘空间使用情况
        run: |
          echo "清理后硬盘空间使用情况:"
          df -hT

      - name: 初始化环境
        run: |
          chmod +x scripts/init-env.sh && ./scripts/init-env.sh

      - name: 恢复 ccache 缓存
        uses: actions/cache@v6.1.0
        with:
          path: ${{env.CCACHE_DIR}}
          key: ccache-${{ matrix.config_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.config_name }}-

      - name: 设置环境
        run: |
          echo "CONFIG_FILE=custom_config/${{matrix.config_name}}.config" >> $GITHUB_ENV
          echo "COMPILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV
          echo "COMPILE_TIME=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          LOG_ROOT="$GITHUB_WORKSPACE/logs"
          echo "LOG_ROOT=$LOG_ROOT" >> $GITHUB_ENV
          mkdir -p "$LOG_ROOT"

      # - name: 克隆OpenWrt源码
      #   run: |
      #     git clone -b ${{env.OPENWRT_BRANCH}} --single-branch --depth 1 https://github.com/${{env.OPENWRT_REPO}}.git ${{env.OPENWRT_DIR}}

      - name: 克隆OpenWrt源码
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{env.OPENWRT_REPO}}
          ref: ${{env.OPENWRT_BRANCH}}
          path: ${{env.OPENWRT_DIR}}
          fetch-depth: 1
          persist-credentials: false

      - name: 复制自定义文件
        run: |
          cd ${{env.OPENWRT_DIR}}
          cp -rf ../build/x86-64/* .
          chmod +x files/etc/uci-defaults/*.sh
          chmod +x custom_scripts/*.sh

      - name: 更新&安装插件
        run: |
          cd ${{env.OPENWRT_DIR}} 
          ./custom_scripts/apply_custom_feeds.sh

      - name: 生成配置文件
        run: |
          cd ${{env.OPENWRT_DIR}}
          [ -f "${{env.CONFIG_FILE}}" ] && cp -f "${{env.CONFIG_FILE}}" .config
          make defconfig V=s
          ./scripts/diffconfig.sh >"$(basename ${{env.CONFIG_FILE}})"

      - name: 设置环境变量
        run: |

          cd ${{env.OPENWRT_DIR}} 
          ./custom_scripts/set_variable_values.sh

      - name: 应用自定义设置
        run: |
          cd ${{env.OPENWRT_DIR}}
          ./custom_scripts/apply_custom_settings.sh

      - name: 下载依赖包
        id: download
        if: success()
        run: |
          cd ${{env.OPENWRT_DIR}}
          (make download -j $(($(nproc)+1)) V=s || make download -j1 V=s) > "${{env.LOG_ROOT}}/download.log" 2>&1

      - name: 编译固件
        id: compile
        if: success()
        run: |
          cd ${{env.OPENWRT_DIR}}
          echo -e "$(($(nproc) + 1)) thread compile"
          (make -j $(($(nproc)+1)) V=sc || make -j1 V=s) > "${{env.LOG_ROOT}}/openwrt.log" 2>&1
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 编译后硬盘空间使用情况
        run: |
          echo "编译后硬盘空间使用情况:"
          df -hT

      - name: 校验编译产物
        id: verify
        if: steps.compile.outputs.status == 'success'
        run: |
          cd ${{env.OPENWRT_DIR}}
          if ! find bin/targets -name "*.img.gz" | head -1 | grep -q .; then
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: 组织编译后的固件
        run: |
          cd ${{env.OPENWRT_DIR}} 
          ./custom_scripts/collect_upload.sh

      - name: 上传固件到Artifacts
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{env.OPENWRT_BRANCH}}-${{env.COMPILE_TIME}}
          path: ${{env.UPLOAD_DIR}}/
          overwrite: true

      - name: 上传固件到Releases
        if: steps.verify.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{env.OPENWRT_BRANCH}}-${{env.COMPILE_TIME}}
          token: ${{secrets.GITHUB_TOKEN}}
          make_latest: true
          working_directory: ${{env.UPLOAD_DIR}}
          files: |
            *.img.gz
            sha256sums
          body: |
            ## 📒 固件信息
            - ⚽ 固件源码: https://github.com/${{env.OPENWRT_REPO}}
            - 💝 源码分支: ${{env.OPENWRT_BRANCH}}
            - 🚀 内核版本: ${{env.KERNEL_VERSION}}
            - 🌐 默认地址: ${{env.IP_ADDRESS}}
            - 🔑 默认密码: password

  Delete_Workflow:
    needs: [Build_OpenWrt]
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: 删除旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 7
          keep_minimum_runs: 2
