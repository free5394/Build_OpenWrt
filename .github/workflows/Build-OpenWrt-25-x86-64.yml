name: Build-OpenWrt-25-x86-64

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "选择要编译的源码"
        required: true
        default: "immortalwrt/immortalwrt"
        type: string

      repo_branch:
        description: "选择要编译的分支"
        required: true
        default: "v25.12.1"
        type: string

      part_size:
        description: "设置rootfs大小"
        required: false
        default: 1024
        type: number

      ip_address:
        description: "设置默认IP地址"
        required: false
        default: "192.168.10.1"
        type: string

      upload_artifact:
        description: "上传固件到Artifact"
        required: false
        default: true
        type: boolean

      upload_release:
        description: "上传固件到Releases"
        required: false
        default: true
        type: boolean

env:
  OPENWRT_DIR: openwrt
  UPLOAD_DIR: upload
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build_OpenWrt:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      OPENWRT_REPO: ${{inputs.repo_name}}
      OPENWRT_BRANCH: ${{inputs.repo_branch}}
      PART_SIZE: ${{inputs.part_size}}
      IP_ADDRESS: ${{inputs.ip_address}}
      UPLOAD_ARTIFACT: ${{inputs.upload_artifact}}
      UPLOAD_RELEASE: ${{inputs.upload_release}}
      CCACHE_DIR: /home/runner/.ccache

    strategy:
      fail-fast: false
      matrix:
        config_name:
          # - minimal
          # - standard
          - full

    steps:
      - name: 克隆仓库
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 当前环境信息
        run: |
          chmod +x scripts/check.sh && ./scripts/check.sh

      - name: 清理磁盘空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 清理后硬盘空间使用情况
        run: |
          echo "清理后硬盘空间使用情况:"
          df -hT

      - name: 初始化环境
        run: |
          chmod +x scripts/init-env.sh && ./scripts/init-env.sh

      - name: 恢复 ccache 缓存
        uses: actions/cache@v6.1.0
        with:
          path: /home/runner/.ccache
          key: ccache-${{ matrix.config_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.config_name }}-

      - name: 克隆OpenWrt源码
        run: |
          git clone -b ${{env.OPENWRT_BRANCH}} --single-branch --depth 1 https://github.com/${{env.OPENWRT_REPO}}.git ${{env.OPENWRT_DIR}}

      - name: 复制自定义文件
        run: |
          cd ${{env.OPENWRT_DIR}}
          cp -rf ../build/x86-64/* .
          chmod +x files/etc/uci-defaults/*.sh
          chmod +x custom_scripts/*.sh
          mkdir -p ./logs

      - name: 更新&安装插件
        run: |
          cd ${{env.OPENWRT_DIR}} 
          ./custom_scripts/apply_custom_feeds.sh > logs/apply_custom_feeds.log 2>&1

      - name: 生成配置文件
        run: |
          CONFIG_FILE="custom_config/${{matrix.config_name}}.config"
          cd ${{env.OPENWRT_DIR}}
          [ -e "$CONFIG_FILE" ] && cp -f "$CONFIG_FILE" .config
          make defconfig > logs/make_defconfig.log 2>&1

      - name: 设置环境变量
        run: |
          echo "NAME_SUFFIX=${{matrix.config_name}}" >> $GITHUB_ENV
          cd ${{env.OPENWRT_DIR}} 
          ./custom_scripts/set_variable_values.sh > logs/set_variable_values.log 2>&1

      - name: 应用自定义设置
        run: |
          cd ${{env.OPENWRT_DIR}}
          ./custom_scripts/apply_custom_settings.sh > logs/apply_custom_settings.log 2>&1

      - name: 下载依赖包
        id: download
        if: success()
        run: |
          cd ${{env.OPENWRT_DIR}}
          (make download -j $(($(nproc)+1)) V=s || make download -j1 V=s) > logs/download.log 2>&1

      - name: 编译固件
        id: compile
        if: success()
        run: |
          cd ${{env.OPENWRT_DIR}}
          echo -e "$(($(nproc) + 1)) thread compile"
          (make -j $(($(nproc)+1)) V=sc || make -j1 V=s) > logs/openwrt.log 2>&1
          echo "status=success" >> $GITHUB_OUTPUT
          echo "COMPILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV
          echo "COMPILE_TIME=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 编译后硬盘空间使用情况
        run: |
          echo "编译后硬盘空间使用情况:"
          df -hT

      - name: 校验编译产物
        run: |
          cd ${{env.OPENWRT_DIR}}
          if ! find bin/targets -name "*.img.gz" | head -1 | grep -q .; then
            echo "错误: 未找到编译产物 (*.img.gz)"
            exit 1
          fi
          echo "编译产物校验通过"

      - name: 组织编译后的固件
        run: |
          cd ${{env.OPENWRT_DIR}} 
          ./custom_scripts/collect_upload.sh

      - name: 上传固件到Artifacts
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{env.OPENWRT_BRANCH}}-${{env.COMPILE_DATE}}
          path: ${{env.UPLOAD_DIR}}/
          overwrite: true

      - name: 上传固件到Releases
        if: steps.compile.outputs.status == 'success' && !cancelled() && env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{env.OPENWRT_BRANCH}}-${{env.COMPILE_DATE}}-${{github.run_number}}
          token: ${{secrets.GITHUB_TOKEN}}
          make_latest: true
          working_directory: ${{env.UPLOAD_DIR}}
          files: |
            *.img.gz
          body: |
            ## 📒 固件信息
            - ⚽ 固件源码: https://github.com/${{env.OPENWRT_REPO}}
            - 💝 源码分支: ${{env.OPENWRT_BRANCH}}
            - 🚀 内核版本: ${{env.KERNEL_VERSION}}
            - 🌐 默认地址: ${{env.IP_ADDRESS}}
            - 🔑 默认密码: password

  Delete_Workflow:
    needs: [Build_OpenWrt]
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: 删除旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 7
          keep_minimum_runs: 2
