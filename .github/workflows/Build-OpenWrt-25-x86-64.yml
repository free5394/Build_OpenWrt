name: Build-OpenWrt-25-x86-64

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "选择要编译的源码"
        required: true
        default: "immortalwrt/immortalwrt"
        type: string

      repo_branch:
        description: "选择要编译的分支"
        required: true
        default: "v25.12.2"
        type: string

      part_size:
        description: "设置rootfs大小"
        required: true
        default: 1024
        type: number

      ip_address:
        description: "设置默认IP地址"
        required: true
        default: "192.168.10.1"
        type: string

      upload_artifact:
        description: "上传固件到Artifact"
        required: false
        default: true
        type: boolean

      upload_release:
        description: "上传固件到Releases"
        required: false
        default: true
        type: boolean

env:
  OPENWRT_DIR: openwrt
  UPLOAD_DIR: upload
  LOG_DIR: logs
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build_OpenWrt:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash

    env:
      OPENWRT_REPO: ${{ inputs.repo_name || 'immortalwrt/immortalwrt' }}
      OPENWRT_BRANCH: ${{ inputs.repo_branch || 'v25.12.2' }}
      PART_SIZE: ${{ inputs.part_size || 1024 }}
      IP_ADDRESS: ${{ inputs.ip_address || '192.168.10.1' }}
      UPLOAD_ARTIFACT: ${{ inputs.upload_artifact}}
      UPLOAD_RELEASE: ${{ inputs.upload_release }}
      CCACHE_DIR: /home/runner/.ccache
      # 固定编译器指纹：ccache 默认 compiler_check=mtime，依赖编译器二进制的大小与 mtime；
      # 而每轮都会从零重建 toolchain-x86_64_gcc-14.3.0_musl，mtime 必然变化，导致目标侧编译全部 miss。
      # 指纹取值为源码仓库 + 分支 + 目标架构 + GCC 版本 + libc，任一项变化时应同步更新此字符串。
      CCACHE_COMPILERCHECK: "string:${{ inputs.repo_name || 'immortalwrt/immortalwrt' }}-${{ inputs.repo_branch || 'v25.12.2' }}-x86-64-gcc-14.3.0-musl"
      # LOG_REDIRECTION_ENABLE: 0 # 是否开启日志重定向，0 不启用， 1 启用

    strategy:
      fail-fast: false
      matrix:
        config_name:
          - minimal
          # - standard
          # - full

    steps:
      - name: 克隆仓库
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 当前环境信息
        run: |
          chmod +x scripts/init/check.sh && ./scripts/init/check.sh

      - name: 清理磁盘空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 清理后硬盘空间使用情况
        run: |
          echo "清理后硬盘空间使用情况:"
          df -hT

      - name: 初始化环境
        run: |
          chmod +x scripts/init/init-env.sh && ./scripts/init/init-env.sh

      - name: 恢复 ccache 缓存
        uses: actions/cache@v6.1.0
        with:
          path: ${{env.CCACHE_DIR}}
          key: ccache-${{ matrix.config_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.config_name }}-

      - name: 设置环境
        run: |
          echo "CUSTOM_CONFIG=custom_config/${{matrix.config_name}}.config" >> $GITHUB_ENV
          echo "COMPILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV
          echo "COMPILE_TIME=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          mkdir -p "$LOG_DIR" "$UPLOAD_DIR"
          # 缓存会带回上一轮的统计文件，此处清零，使构建结束时的 ccache -s 只反映本轮
          ccache -z

      - name: 克隆OpenWrt源码
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{env.OPENWRT_REPO}}
          ref: ${{env.OPENWRT_BRANCH}}
          path: ${{env.OPENWRT_DIR}}
          fetch-depth: 1
          persist-credentials: false

      - name: 复制自定义文件
        run: |
          cp -rf target/x86-64/* "${{env.OPENWRT_DIR}}"
          chmod +x "${{env.OPENWRT_DIR}}"/files/etc/uci-defaults/*.sh
          chmod +x scripts/custom/*.sh

      - name: 更新&安装插件
        run: |
          ./scripts/custom/apply_custom_feeds.sh 2>&1 | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/apply_custom_feeds.log"

      - name: 生成配置文件
        run: |
          cd "${{env.OPENWRT_DIR}}"
          [ -f "${{env.CUSTOM_CONFIG}}" ] && cp -f "${{env.CUSTOM_CONFIG}}" .config
          # 启用 ccache：CONFIG_CCACHE 的提示受 CONFIG_DEVEL 门控，缓存目录需与 actions/cache 的 path 一致
          {
            echo 'CONFIG_DEVEL=y'
            echo 'CONFIG_CCACHE=y'
            echo 'CONFIG_CCACHE_DIR="/home/runner/.ccache"'
          } >> .config
          make defconfig V=s
          ./scripts/diffconfig.sh >"$(basename ${{env.CUSTOM_CONFIG}})"

      - name: 设置环境变量
        run: |
          ./scripts/custom/set_variable_values.sh 2>&1 | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/set_variable_values.log"

      - name: 应用自定义设置
        run: |
          ./scripts/custom/apply_custom_settings.sh 2>&1 | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/apply_custom_settings.log"

      - name: 下载依赖包
        id: download
        if: success()
        run: |
          cd ${{env.OPENWRT_DIR}}
          (make download -j $(($(nproc)+1)) V=s || make download -j1 V=s) 2>&1 | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/download.log"

      - name: 编译固件
        id: compile
        if: success()
        run: |
          cd ${{env.OPENWRT_DIR}}
          echo -e "$(($(nproc) + 1)) thread compile"
          (make -j $(($(nproc)+1)) V=sc || make -j1 V=s) 2>&1 | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/compile.log"

      - name: 编译后硬盘空间使用情况
        run: |
          echo "编译后硬盘空间使用情况:"
          df -hT

      - name: 校验编译产物
        id: verify
        if: success()
        run: |
          cd ${{env.OPENWRT_DIR}}
          _img=$(find bin/targets -name "*.img.gz" -print -quit)
          if [ -z "$_img" ]; then
            echo "::error::未找到编译产物 *.img.gz"
            exit 1
          fi
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 组织编译后的固件
        run: |
          ./scripts/custom/collect_upload.sh 2>&1 | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/collect_upload.log"

      - name: 上传固件到Artifacts
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{env.OPENWRT_BRANCH}}-${{env.COMPILE_TIME}}
          path: ${{env.UPLOAD_DIR}}/
          overwrite: true

      - name: 上传固件到Releases
        if: steps.verify.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{env.OPENWRT_BRANCH}}-${{env.COMPILE_TIME}}
          token: ${{secrets.GITHUB_TOKEN}}
          make_latest: true
          working_directory: ${{env.UPLOAD_DIR}}
          files: |
            *.img.gz
            *.config
            sha256sums
          body: |
            ## 📒 固件信息
            - ⚽ 固件源码: https://github.com/${{env.OPENWRT_REPO}}
            - 💝 源码分支: ${{env.OPENWRT_BRANCH}}
            - 🚀 内核版本: ${{env.KERNEL_VERSION}}
            - 🌐 默认地址: ${{env.IP_ADDRESS}}
            - 🔑 默认密码: 无

  Delete_Workflow:
    needs: [Build_OpenWrt]
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: 删除旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 7
          keep_minimum_runs: 2
