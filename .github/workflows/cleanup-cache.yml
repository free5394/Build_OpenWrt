name: 清理过期 ccache 缓存

# 定时：每月 1 日与 16 日 03:00 UTC（北京时间 11:00）。
# 说明：cron 无法表达严格的 15 天间隔，这里用 1/16 日近似，实际间隔在 15 与 16 天之间轮换。
# 定时触发执行实际删除；手动触发默认 dry_run=true，只打印清单不删除。
on:
  schedule:
    - cron: '0 3 1,16 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印待清理清单，不执行删除"
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  Cleanup_Cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 定时触发走实际删除（false）；手动触发跟随 dry_run 输入
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

    steps:
      - name: 清理过期 ccache 缓存
        run: |
          repo="${{ github.repository }}"
          keep_n=2

          # 仅处理 key 前缀为 ccache- 的条目，其他缓存一律不动。
          # 按 created_at（ISO 8601 字符串，可字典序比较）倒序：actions/cache 的
          # restore-keys 在多个匹配项中也取最近创建的一条，保留策略与其保持一致。
          list_ccache() {
              gh api "repos/$repo/actions/caches?per_page=100" --paginate \
                  --jq '.actions_caches[] | select(.key | startswith("ccache-")) | [.created_at, .id, .size_in_bytes, .key, .ref] | @tsv' \
                  | sort -r
          }

          caches=$(list_ccache)
          if [ -z "$caches" ]; then
              echo "仓库中没有 ccache 缓存，无需清理"
              exit 0
          fi

          echo "=== 当前 ccache 缓存（最新在前）==="
          printf '%s\n' "$caches" | awk -F'\t' '{printf "%2d. %s  %8.2f MB  %s  (id=%s)\n", NR, $1, $3/1048576, $4, $2}'

          total=$(printf '%s\n' "$caches" | wc -l | tr -d ' ')
          if [ "$total" -le "$keep_n" ]; then
              echo "共 ${total} 条，未超过保留上限 ${keep_n} 条，无需清理"
              exit 0
          fi

          # 用 sed 而非 head/tail：head 提前关闭管道会触发 SIGPIPE，在 pipefail 下会误判失败
          kept=$(printf '%s\n' "$caches" | sed -n "1,${keep_n}p")
          to_delete=$(printf '%s\n' "$caches" | sed -n "$((keep_n + 1)),\$p")

          echo "=== 保留（最新 ${keep_n} 条）==="
          printf '%s\n' "$kept" | awk -F'\t' '{printf "  %s  %s (id=%s)\n", $4, $1, $2}'
          echo "=== 待删除 ==="
          printf '%s\n' "$to_delete" | awk -F'\t' '{printf "  %s  %s (id=%s)\n", $4, $1, $2}'

          del_count=$(printf '%s\n' "$to_delete" | wc -l | tr -d ' ')
          freed=$(printf '%s\n' "$to_delete" | awk -F'\t' '{s+=$3} END {printf "%.2f", s/1048576}')
          echo "保留 ${keep_n} 条 / 删除 ${del_count} 条 / 预计释放 ${freed} MB"

          if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry_run] 仅打印清单，不执行删除"
              exit 0
          fi

          printf '%s\n' "$to_delete" | while IFS=$'\t' read -r created id size key ref; do
              [ -z "$id" ] && continue
              echo "删除: ${key}（id=${id}，created=${created}）"
              gh api -X DELETE "repos/$repo/actions/caches/${id}"
          done

          echo "=== 清理后剩余 ccache 缓存 ==="
          after=$(list_ccache)
          if [ -z "$after" ]; then
              echo "已无 ccache 缓存"
          else
              printf '%s\n' "$after" | awk -F'\t' '{printf "%2d. %s  %8.2f MB  %s  (id=%s)\n", NR, $1, $3/1048576, $4, $2}'
          fi
